# Nordwell Provisions, deployed as its own service.
#
# `type: web` with a start command is a long-lived container, which this merchant requires:
# its catalogue is in memory and the perturbation faults write to it. On a host that starts a
# fresh instance per request the price-drift journey would report that this merchant's prices
# cannot be moved — the engine would be right and the deployment would be wrong.
#
# Deliberately not the AgentProof app. The point of deploying is that the merchant answers
# from somewhere AgentProof does not control.
services:
  - type: web
    name: nordwell-provisions
    runtime: node
    plan: free
    # `--include=dev` is required, not tidiness. The server is TypeScript and runs under
    # `tsx`, which is a devDependency, and a host that builds with NODE_ENV=production makes
    # plain `npm ci` skip devDependencies entirely. The build then succeeds, the deploy goes
    # live, and the start command dies with `tsx: not found` — a failure that looks like a
    # platform mystery rather than a missing flag. Measured: without this, tsx is absent.
    buildCommand: npm ci --include=dev
    startCommand: npm run nordwell:serve
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
